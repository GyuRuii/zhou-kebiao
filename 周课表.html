if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

<style>
  :root {
    --bg: #fff7ee;
    --card: #ffffff;
    --text: #2a2018;
    --muted: #8a7a68;
    --border: #f0e2d2;
    --line: #f7ece0;
    --accent: #f97316;
    --accent-soft: rgba(249, 115, 22, .10);
    --accent-strong: rgba(249, 115, 22, .22);
    --danger: #dc2626;
    --today-tint: rgba(249, 115, 22, .06);
    --memo-bg: #fff9e0;
    --memo-border: #e8d9a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171310;
      --card: #201a15;
      --text: #efe5da;
      --muted: #9c8b7a;
      --border: #33291f;
      --line: #2b231c;
      --accent: #fb923c;
      --accent-soft: rgba(251, 146, 60, .14);
      --accent-strong: rgba(251, 146, 60, .26);
      --danger: #f87171;
      --today-tint: rgba(251, 146, 60, .08);
      --memo-bg: #2e2918;
      --memo-border: #5a4c2c;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* 确保弹窗等元素用 hidden 属性一定可以关闭 */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .container { max-width: 1120px; margin: 0 auto; padding: 24px 20px 40px; }

  header.top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 22px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .actions { display: flex; align-items: center; gap: 10px; }

  .mascot { display: flex; align-items: center; gap: 8px; margin-right: 4px; }
  .avatar {
    position: relative;
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #fdba74, #f97316);
    color: #fff; font-weight: 700; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(249, 115, 22, .35);
  }
  .chestnut-badge {
    position: absolute; top: -6px; right: -7px;
    font-size: 13px; line-height: 1;
    transform: rotate(18deg);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .25));
  }
  .avatar img {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; display: block;
  }
  .mascot .name { font-size: 14px; font-weight: 600; }

  .tsundere {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px; padding: 6px 12px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--accent-soft); font-size: 12.5px;
  }

  /* ===== 底部:秦可海报 ===== */
  .mascot-gallery {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    margin-top: 18px; padding: 14px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card);
  }
  .mascot-gallery img.gallery {
    width: 132px; border-radius: 10px; display: block;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
  }
  .gallery-text { flex: 1; min-width: 220px; }

  /* ===== 小备忘录 ===== */
  .memo-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .memo {
    position: relative; flex: 1; min-width: 200px; max-width: 360px;
    background: var(--memo-bg);
    border: 1px dashed var(--memo-border);
    border-radius: 12px;
    padding: 24px 12px 8px;
    transform: rotate(-1.6deg);
    box-shadow: 0 3px 10px rgba(0, 0, 0, .10);
  }
  .memo-pin {
    position: absolute; top: -11px; left: 50%;
    transform: translateX(-50%) rotate(10deg);
    font-size: 19px; line-height: 1;
  }
  .memo-title { display: block; text-align: center; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .memo textarea {
    width: 100%; border: none; outline: none; resize: none;
    background: transparent; color: var(--text);
    font-family: inherit; font-size: 12.5px; line-height: 1.6;
    min-height: 62px;
  }
  .memo textarea::placeholder { color: var(--muted); opacity: .7; }

  /* ===== 右下角小栗子 ===== */
  .corner-chestnut {
    position: fixed; right: 18px; bottom: 14px; z-index: 45;
    font-size: 68px; line-height: 1; pointer-events: none;
    transform: rotate(-15deg);
    filter: drop-shadow(0 3px 8px rgba(0, 0, 0, .22));
    animation: chestnut-bob 3s ease-in-out infinite alternate;
  }
  @keyframes chestnut-bob {
    from { translate: 0 0; }
    to { translate: 0 -5px; }
  }

  .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(.95); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-danger { color: var(--danger); border-color: transparent; background: transparent; }
  .zoom-label { font-size: 12px; color: var(--muted); min-width: 40px; text-align: center; }

  /* ===== 课表网格 ===== */
  .grid-wrap {
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--card); overflow: auto;
    max-height: calc(100vh - 400px);
    user-select: none; -webkit-user-select: none;
  }
  .grid {
    display: grid;
    grid-template-columns: 56px repeat(7, minmax(var(--colw, 110px), 1fr));
    grid-template-rows: 44px var(--gh, 960px); /* 1 小时 = 60px,可通过缩放按钮调整 */
    min-width: calc(var(--colw, 110px) * 7 + 56px);
  }
  .corner, .day-header {
    position: sticky; top: 0; z-index: 6; background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .day-header { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 44px; }
  .day-header.today { color: var(--accent); }
  .chip {
    font-size: 10.5px; background: var(--accent); color: #fff;
    border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px;
  }

  .time-col { position: relative; }
  .hour-label { position: relative; height: var(--hh, 60px); }
  .hour-label span {
    position: absolute; top: -8px; right: 8px;
    font-size: 11px; color: var(--muted);
  }

  .day-col { position: relative; height: var(--gh, 960px); }
  .day-col.today { background: var(--today-tint); }
  .slot {
    height: var(--hh, 60px); border-top: 1px solid var(--line);
    cursor: pointer; touch-action: manipulation;
  }
  .slot:hover { background: var(--accent-soft); }
  .slot.hovered { background: var(--accent-strong); }

  .event {
    position: absolute; z-index: 3;
    background: var(--ev-bg); color: var(--ev-fg);
    border-left: 3px solid var(--ev-fg);
    border-radius: 6px; padding: 4px 8px;
    font-size: 12px; overflow: hidden;
    cursor: grab; touch-action: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .event .t { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .r { display: block; font-size: 10.5px; opacity: .8; }
  .event.dragging {
    opacity: .85; z-index: 20; cursor: grabbing;
    pointer-events: none;
    box-shadow: 0 8px 20px rgba(0,0,0,.28);
  }

  .now-line {
    position: absolute; left: 0; right: 0; height: 0; z-index: 4;
    border-top: 2px solid #ef4444; pointer-events: none;
  }
  .now-line::before {
    content: ''; position: absolute; left: -3px; top: -5px;
    width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
  }

  /* ===== 弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    width: 360px; max-width: 100%; background: var(--card);
    border-radius: 14px; padding: 20px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-close {
    border: none; background: transparent; color: var(--muted);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 8px;
    border-radius: 8px; font-family: inherit;
  }
  .modal-close:hover { background: var(--accent-soft); color: var(--text); }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .modal input, .modal select {
    width: 100%; padding: 8px 10px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text);
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%;
    border: none; cursor: pointer; padding: 0;
  }
  .swatch.sel { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
  .error { color: var(--danger); font-size: 12.5px; margin: 8px 0 0; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
</style>
</head>

const grid = $('#grid'), overlay = $('#overlay'), form = $('#eventForm');
const fTitle = $('#fTitle'), fDay = $('#fDay'), fStart = $('#fStart'),
      fEnd = $('#fEnd'), fLoc = $('#fLoc');
const swatches = $('#swatches'), formError = $('#formError'),
      deleteBtn = $('#deleteBtn'), modalTitle = $('#modalTitle');

/* ---------- 工具 ---------- */
const fmt = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const uid = () => crypto.randomUUID ? crypto.randomUUID() : `e${Date.now()}-${Math.random().toString(36).slice(2)}`;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let events = load();
let editingId = null;
let selectedColor = 0;
const ZOOM_KEY = 'weekly-timetable-zoom-v1';
let zoom = Math.min(1.5, Math.max(.4, parseFloat(localStorage.getItem(ZOOM_KEY)) || 1));
const zoomLabel = $('#zoomLabel');

/* ---------- 存取 ---------- */
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (!Array.isArray(raw)) return [];
    return raw
      .filter(e => e && typeof e.title === 'string' && e.title &&
                   Number.isInteger(e.day) && e.day >= 0 && e.day < 7 &&
                   Number.isFinite(e.start) && Number.isFinite(e.end) && e.start < e.end)
      .map(e => ({
        id: typeof e.id === 'string' ? e.id : uid(),
        title: e.title,
        day: e.day,
        start: clamp(Math.round(e.start), START_MIN, END_MIN),
        end: clamp(Math.round(e.end), START_MIN, END_MIN),
        color: Number.isInteger(e.color) && e.color >= 0 && e.color < COLORS.length ? e.color : 0,
        location: typeof e.location === 'string' ? e.location : '',
      }))
      .filter(e => e.start < e.end);
  } catch { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(events)); }

/* ---------- 构建网格 ---------- */
function buildGrid() {
  grid.innerHTML = '';
  grid.append(el('div', 'corner'));
  DAYS.forEach((d, i) => {
    const h = el('div', 'day-header', d);
    h.dataset.day = i;
    grid.append(h);
  });
  const timeCol = el('div', 'time-col');
  for (let m = START_MIN; m < END_MIN; m += 60) {
    const l = el('div', 'hour-label');
    l.append(el('span', '', fmt(m)));
    timeCol.append(l);
  }
  grid.append(timeCol);
  for (let d = 0; d < 7; d++) {
    const col = el('div', 'day-col');
    col.dataset.day = d;
    for (let h = 0; h < HOURS; h++) {
      const s = el('div', 'slot');
      s.dataset.day = d;
      s.dataset.hour = h;
      s.addEventListener('click', () => openAdd(d, h));
      col.append(s);
    }
    grid.append(col);
  }
}

/* ---------- 渲染日程(含重叠自动分列) ---------- */
function layoutDay(evs) {
  const sorted = [...evs].sort((a, b) => a.start - b.start || a.end - b.end);
  const clusters = [];
  for (const e of sorted) {
    const c = clusters.find(c => c.lastEnd <= e.start);
    if (c) { c.events.push(e); c.lastEnd = Math.max(c.lastEnd, e.end); }
    else clusters.push({ events: [e], lastEnd: e.end });
  }
  const out = [];
  for (const c of clusters) {
    const colEnds = [];
    for (const e of c.events) {
      let idx = colEnds.findIndex(end => end <= e.start);
      if (idx === -1) { colEnds.push(e.end); idx = colEnds.length - 1; }
      else colEnds[idx] = e.end;
      out.push({ ev: e, col: idx, cols: colEnds.length });
    }
  }
  return out;
}

function renderAll() {
  const cols = grid.querySelectorAll('.day-col');
  cols.forEach(col => col.querySelectorAll('.event').forEach(b => b.remove()));
  for (let d = 0; d < 7; d++) {
    const laid = layoutDay(events.filter(e => e.day === d));
    for (const { ev, col: ci, cols: n } of laid) {
      const c = COLORS[ev.color];
      const dur = ev.end - ev.start;
      const b = el('div', 'event');
      b.style.setProperty('--ev-bg', c.bg);
      b.style.setProperty('--ev-fg', c.fg);
      const hh = 60 * zoom;
      b.style.top = (ev.start - START_MIN) / 60 * hh + 1 + 'px';
      b.style.height = (dur / 60 * hh - 2) + 'px';
      b.style.left = `calc(${ci * 100 / n}% + 1px)`;
      b.style.width = `calc(${100 / n}% - 2px)`;
      b.append(el('span', 't', ev.title));
      if (dur >= 60) b.append(el('span', 'r', `${fmt(ev.start)} – ${fmt(ev.end)}`));
      b.title = ev.location ? `${ev.title} · ${ev.location}` : ev.title;
      attachDrag(b, ev);
      cols[d].append(b);
    }
  }
  updateNow();
}

/* ---------- 拖动日程 ---------- */
function attachDrag(b, ev) {
  b.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let active = false, hovered = null;
    const move = ev2 => {
      const dx = ev2.clientX - sx, dy = ev2.clientY - sy;
      if (!active) {
        if (Math.hypot(dx, dy) < 5) return;   // 小于 5px 视为点击
        active = true;
        b.classList.add('dragging');
      }
      b.style.transform = `translate(${dx}px, ${dy}px)`;
      const t = document.elementFromPoint(ev2.clientX, ev2.clientY);
      const s = t && t.closest ? t.closest('.slot') : null;
      if (s !== hovered) {
        if (hovered) hovered.classList.remove('hovered');
        hovered = s;
        if (hovered) hovered.classList.add('hovered');
      }
    };
    const end = ev2 => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointercancel', end);
      b.classList.remove('dragging');
      b.style.transform = '';
      if (hovered) hovered.classList.remove('hovered');
      if (!active) { openEdit(ev); return; }   // 未移动 → 打开编辑
      const t = document.elementFromPoint(ev2.clientX, ev2.clientY);
      const s = t && t.closest ? t.closest('.slot') : null;
      if (s) {
        const top = s.closest('.day-col').getBoundingClientRect().top;
        const dur = ev.end - ev.start;
        const mins = Math.round((ev2.clientY - top) / (30 * zoom)) * 30;  // 吸附到半小时(随缩放)
        const start = clamp(START_MIN + mins, START_MIN, END_MIN - dur);
        ev.day = +s.dataset.day;
        ev.start = start;
        ev.end = start + dur;
        save();
        renderAll();
      }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end, { once: true });
    window.addEventListener('pointercancel', end, { once: true });
  });
}

/* ---------- 弹窗 ---------- */
function buildFormControls() {
  fDay.innerHTML = DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join('');
  let s = '';
  for (let m = START_MIN; m <= END_MIN - 30; m += 30) s += `<option value="${m}">${fmt(m)}</option>`;
  fStart.innerHTML = s;
  let e2 = '';
  for (let m = START_MIN + 30; m <= END_MIN; m += 30) e2 += `<option value="${m}">${fmt(m)}</option>`;
  fEnd.innerHTML = e2;
  COLORS.forEach((c, i) => {
    const b = el('button', 'swatch');
    b.type = 'button';
    b.dataset.color = i;
    b.style.background = c.bg;
    b.style.boxShadow = `inset 0 0 0 1px ${c.fg}33`;
    b.addEventListener('click', () => selectColor(i));
    swatches.append(b);
  });
}
function selectColor(i) {
  selectedColor = i;
  [...swatches.children].forEach((b, idx) => b.classList.toggle('sel', idx === i));
}
function openAdd(day, hour) {
  editingId = null;
  deleteBtn.hidden = true;
  modalTitle.textContent = '添加日程';
  fTitle.value = '';
  fLoc.value = '';
  fDay.value = day;
  fStart.value = START_MIN + hour * 60;
  fEnd.value = START_MIN + hour * 60 + 60;
  selectColor(events.length % COLORS.length);
  formError.hidden = true;
  overlay.hidden = false;
  fTitle.focus();
}
function openEdit(ev) {
  editingId = ev.id;
  deleteBtn.hidden = false;
  modalTitle.textContent = '编辑日程';
  fTitle.value = ev.title;
  fLoc.value = ev.location;
  fDay.value = ev.day;
  fStart.value = ev.start;
  fEnd.value = ev.end;
  selectColor(ev.color);
  formError.hidden = true;
  overlay.hidden = false;
  fTitle.focus();
}
function closeModal() { overlay.hidden = true; editingId = null; }
function showError(msg) { formError.textContent = msg; formError.hidden = false; }

fStart.addEventListener('change', () => {
  if (+fEnd.value <= +fStart.value) fEnd.value = Math.min(+fStart.value + 60, END_MIN);
});
form.addEventListener('submit', e => {
  e.preventDefault();
  const title = fTitle.value.trim();
  if (!title) return showError('请输入日程名称');
  const day = +fDay.value, start = +fStart.value, end = +fEnd.value;
  if (end <= start) return showError('结束时间必须晚于开始时间');
  if (editingId) {
    const ev = events.find(x => x.id === editingId);
    Object.assign(ev, { title, day, start, end, color: selectedColor, location: fLoc.value.trim() });
  } else {
    events.push({ id: uid(), title, day, start, end, color: selectedColor, location: fLoc.value.trim() });
  }
  save();
  renderAll();
  closeModal();
});
deleteBtn.addEventListener('click', () => {
  if (editingId == null || !confirm('确定删除这条日程吗?')) return;
  events = events.filter(e => e.id !== editingId);
  save();
  renderAll();
  closeModal();
});
$('#cancelBtn').addEventListener('click', closeModal);
$('#closeX').addEventListener('click', closeModal);

/* ---------- 小备忘录(自动保存在本地) ---------- */
const memoInput = $('#memo');
memoInput.value = localStorage.getItem(MEMO_KEY) || '';
memoInput.addEventListener('input', () => localStorage.setItem(MEMO_KEY, memoInput.value));
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeModal(); });

/* ---------- 导出 / 导入 ---------- */
$('#exportBtn').addEventListener('click', () => {
  const json = JSON.stringify(events, null, 2);
  // Mac App 内:交给原生「保存」面板
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.export) {
    window.webkit.messageHandlers.export.postMessage(json);
    return;
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '小栗周表.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
/* 清洗日程数组(导入/同步共用) */
function cleanEvents(data) {
  if (!Array.isArray(data)) return null;
  return data
    .filter(e => e && typeof e.title === 'string' && e.title &&
                 Number.isInteger(e.day) && e.day >= 0 && e.day < 7 &&
                 Number.isFinite(e.start) && Number.isFinite(e.end) && e.start < e.end)
    .map(e => ({
      id: typeof e.id === 'string' ? e.id : uid(),
      title: e.title,
      day: e.day,
      start: clamp(Math.round(e.start), START_MIN, END_MIN),
      end: clamp(Math.round(e.end), START_MIN, END_MIN),
      color: Number.isInteger(e.color) && e.color >= 0 && e.color < COLORS.length ? e.color : 0,
      location: typeof e.location === 'string' ? e.location : '',
    }))
    .filter(e => e.start < e.end);
}
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', () => {
  const f = $('#importFile').files[0];
  if (!f) return;
  f.text().then(text => {
    const cleaned = cleanEvents(JSON.parse(text));
    if (!cleaned) throw new Error();
    if (!confirm(`将导入 ${cleaned.length} 条日程,替换当前数据,确定吗?`)) return;
    events = cleaned;
    save();
    renderAll();
  }).catch(() => alert('导入失败:文件格式不正确'));
  $('#importFile').value = '';
});

/* ---------- 同步:从网上拉最新课表 + 备忘录 ---------- */
$('#syncBtn').addEventListener('click', async () => {
  const btn = $('#syncBtn');
  btn.disabled = true;
  try {
    const res = await fetch('./课表.json?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const obj = await res.json();
    const cleaned = cleanEvents(Array.isArray(obj) ? obj : (obj && obj.events));
    if (!cleaned || !cleaned.length) throw new Error('no data');
    const memo = (obj && typeof obj.memo === 'string') ? obj.memo : '';
    if (!confirm(`将同步 ${cleaned.length} 条日程和备忘录,替换本机数据,确定吗?`)) return;
    events = cleaned;
    save();
    localStorage.setItem(MEMO_KEY, memo);
    memoInput.value = memo;
    renderAll();
    alert('同步完成 ✅ 课表和备忘录已与电脑端一致');
  } catch {
    alert('同步失败:请检查网络,或电脑端还没有上传最新数据');
  } finally {
    btn.disabled = false;
  }
});
/* Mac 原生版不需要网络同步,隐藏按钮 */
if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.export) {
  $('#syncBtn').style.display = 'none';
}

/* ---------- 缩放 ---------- */
function applyZoom() {
  const hh = Math.round(60 * zoom);
  document.documentElement.style.setProperty('--hh', hh + 'px');
  document.documentElement.style.setProperty('--gh', HOURS * hh + 'px');
  document.documentElement.style.setProperty('--colw', Math.round(110 * zoom) + 'px');
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
  renderAll();
}
function setZoom(z) {
  zoom = clamp(z, .4, 1.5);
  localStorage.setItem(ZOOM_KEY, zoom);
  applyZoom();
}
function fitZoom() {
  const wrap = $('#gridWrap');
  const s = Math.min(wrap.clientWidth / 936, wrap.clientHeight / 1004);
  setZoom(clamp(s, .4, 1.2));
}
$('#zoomOut').addEventListener('click', () => setZoom(zoom - .1));
$('#zoomIn').addEventListener('click', () => setZoom(zoom + .1));
$('#zoomFit').addEventListener('click', fitZoom);
window.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey)) return;
  if (e.key === '-' || e.key === '_') { e.preventDefault(); setZoom(zoom - .1); }
  else if (e.key === '=' || e.key === '+') { e.preventDefault(); setZoom(zoom + .1); }
  else if (e.key === '0') { e.preventDefault(); setZoom(1); }
});

/* ---------- 今天高亮 + 当前时间线 ---------- */
function updateNow() {
  const now = new Date();
  const today = (now.getDay() + 6) % 7;   // 周一 = 0
  document.querySelectorAll('.day-header .chip').forEach(c => c.remove());
  const header = document.querySelector(`.day-header[data-day="${today}"]`);
  if (header) {
    const chip = el('span', 'chip', '今天');
    header.append(chip);
  }
  document.querySelectorAll('.day-col').forEach(c =>
    c.classList.toggle('today', +c.dataset.day === today));
  document.querySelectorAll('.now-line').forEach(l => l.remove());
  const mins = now.getHours() * 60 + now.getMinutes();
  const col = document.querySelector(`.day-col[data-day="${today}"]`);
  if (col && mins >= START_MIN && mins < END_MIN) {
    const line = el('div', 'now-line');
    line.style.top = (mins - START_MIN) * zoom + 'px';
    line.title = fmt(mins);
    col.append(line);
  }
}

/* ---------- 启动 ---------- */
buildGrid();
buildFormControls();
applyZoom();
setInterval(updateNow, 30000);

})();
</script>
<span class="corner-chestnut" aria-hidden="true" title="栗子">🌰</span>
</body>
</html>
